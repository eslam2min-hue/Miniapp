<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>التثقيف الصحي: مرض السكر</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f3f8f6;--card:#fff;--ink:#16302b;--mute:#5b7670;--accent:#0f7b6c;--line:#d5e6e1;--ans:#e4f3ef}
@media (prefers-color-scheme:dark){:root{--bg:#10201d;--card:#183029;--ink:#e6f2ef;--mute:#9bb8b1;--accent:#3fc4af;--line:#27463f;--ans:#1e3b34}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.8;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
h1{font-size:1.4rem;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 16px;font-size:.95rem}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.q button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:12px;width:100%;padding:14px 16px;cursor:pointer;font-weight:600}
.q button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.q .ar{color:var(--accent);transition:transform .2s;flex:none}
.q.open .ar{transform:rotate(90deg)}
.a{display:none;padding:12px 16px;background:var(--ans);border-top:1px solid var(--line)}
.q.open .a{display:block}
.note{color:var(--mute);font-size:.85rem;margin-top:16px;text-align:center}
</style>
</head>
<body>
<h1>مرض السكر</h1>
<p class="sub">اضغط على أي سؤال لتظهر الإجابة.</p>
<div id="list"></div>
<p class="note">هذه المعلومات للتوعية فقط ولا تغني عن استشارة الطبيب.</p>
<script>
const QA=[
["ما هو مرض السكر؟","مرض مزمن يرتفع فيه مستوى الجلوكوز في الدم لأن الجسم لا يُنتج الإنسولين بكمية كافية، أو لا يستجيب له بشكل سليم."],
["ما هو الإنسولين؟","هرمون يفرزه البنكرياس، ويساعد خلايا الجسم على امتصاص الجلوكوز من الدم واستخدامه كطاقة."],
["ما أنواع السكر؟","النوع الأول، والنوع الثاني، وسكر الحمل. وهناك أنواع أقل شيوعًا."],
["ما الفرق بين النوع الأول والثاني؟","في النوع الأول يهاجم الجهاز المناعي خلايا البنكرياس فيتوقف إنتاج الإنسولين تقريبًا. وفي النوع الثاني يُنتج الجسم الإنسولين لكن بمقاومة أو بكمية غير كافية، وهو الأكثر شيوعًا ويرتبط غالبًا بالوزن الزائد وقلة الحركة."],
["ما أعراض السكر؟","كثرة التبول، والعطش الشديد، والجوع المتكرر، والتعب، وتشوش الرؤية، وبطء التئام الجروح، وفقدان الوزن غير المبرر. وقد لا تظهر أعراض في النوع الثاني لسنوات."],
["كيف يُشخَّص مرض السكر؟","بتحليل سكر صائم، أو تحليل سكر عشوائي، أو اختبار تحمل الجلوكوز، أو التحليل التراكمي HbA1c. والطبيب هو من يؤكد التشخيص."],
["ما المعدل الطبيعي لسكر الدم الصائم؟","أقل من 100 ملجم/ديسيلتر تقريبًا. والقراءة من 100 إلى 125 تُعد مرحلة ما قبل السكر، و126 أو أكثر في تحليلين مختلفين تشير إلى السكر."],
["ما هو التحليل التراكمي HbA1c؟","تحليل يعكس متوسط مستوى السكر في الدم خلال آخر 2 إلى 3 أشهر. وتُعد القراءة 6.5% أو أكثر مؤشرًا للسكر، وهدف معظم المرضى عادةً أقل من 7% لكن الطبيب يحدده لكل حالة."],
["ما هي مرحلة ما قبل السكر؟","ارتفاع في سكر الدم أعلى من الطبيعي لكنه لم يصل لحد التشخيص. يمكن غالبًا منع تحولها إلى سكر بتخفيف الوزن وممارسة الرياضة وتحسين الغذاء."],
["ما عوامل الخطورة للإصابة بالسكر النوع الثاني؟","الوزن الزائد، وقلة النشاط البدني، ووجود تاريخ عائلي، والتقدم في العمر، وارتفاع ضغط الدم، وسكر الحمل السابق."],
["هل يمكن الوقاية من السكر؟","النوع الثاني يمكن الوقاية منه أو تأخيره بنسبة كبيرة بنمط حياة صحي. أما النوع الأول فلا توجد وسيلة مؤكدة للوقاية منه حاليًا."],
["ماذا يأكل مريض السكر؟","الخضروات، والبروتينات قليلة الدهن، والحبوب الكاملة، والبقوليات، والدهون الصحية. مع تنظيم كمية ومواعيد الكربوهيدرات وتقليل السكريات والمشروبات المحلاة."],
["هل يُمنع مريض السكر من الفاكهة؟","لا، لكن تؤخذ بكميات معتدلة وموزعة على اليوم. يُفضل الفاكهة الكاملة على العصير، وتجنب الإفراط في الأنواع شديدة الحلاوة."],
["هل تفيد الرياضة مريض السكر؟","نعم، فهي تحسّن استجابة الجسم للإنسولين وتخفض السكر. يُنصح بنحو 150 دقيقة أسبوعيًا من النشاط المعتدل مثل المشي السريع، بعد استشارة الطبيب."],
["كم مرة أقيس السكر؟","حسب خطة الطبيب ونوع العلاج. من يستخدم الإنسولين يقيس عادةً أكثر من مرة يوميًا، وغيره قد يقيس بشكل أقل. سجّل القراءات واعرضها على طبيبك."],
["ما هو انخفاض السكر (الهبوط) وما أعراضه؟","انخفاض الجلوكوز عن 70 ملجم/ديسيلتر. أعراضه: رعشة، وعرق بارد، وجوع، وخفقان، ودوخة، وتشوش، وقد يصل للإغماء."],
["كيف أتعامل مع انخفاض السكر؟","إذا كان المريض واعيًا: يتناول نحو 15 جرامًا من سكر سريع مثل نصف كوب عصير أو ملعقة كبيرة سكر، ثم يعيد القياس بعد 15 دقيقة. وإذا كان فاقدًا للوعي فلا يُعطى شيئًا بالفم وتُطلب الإسعاف فورًا."],
["ما هي مضاعفات السكر؟","على المدى الطويل مع سوء التحكم: اعتلال الشبكية والعين، وأمراض الكلى، واعتلال الأعصاب، وأمراض القلب والجلطات، ومشاكل القدم."],
["كيف أعتني بقدمي؟","افحصهما يوميًا بحثًا عن جروح أو تشققات أو احمرار، واغسلهما وجففهما جيدًا، وارتدِ حذاءً مريحًا وشرابًا نظيفًا، ولا تمشِ حافيًا، وراجع الطبيب عند أي جرح لا يلتئم."],
["متى يجب أن أذهب للطوارئ؟","عند الإغماء أو التشوش الشديد، أو قيء متكرر مع عطش وتنفس سريع، أو انخفاض سكر لا يستجيب للعلاج، أو ارتفاع شديد في السكر مع أعراض. وكذلك إذا كان المريض غير قادر على تناول شيء."]
];
const list=document.getElementById("list");
QA.forEach(([q,a],i)=>{
  const d=document.createElement("div");d.className="q";
  const b=document.createElement("button");
  b.setAttribute("aria-expanded","false");
  b.innerHTML='<span></span><span class="ar">◂</span>';
  b.firstChild.textContent=(i+1)+". "+q;
  const p=document.createElement("div");p.className="a";p.textContent=a;
  b.onclick=()=>{
    const o=d.classList.toggle("open");
    b.setAttribute("aria-expanded",o);
    try{Telegram.WebApp.HapticFeedback.selectionChanged()}catch(e){}
  };
  d.append(b,p);list.append(d);
});
try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
</script>
</body>
</html>
